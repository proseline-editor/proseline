name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm size
      - run: pnpm --filter react-basic exec playwright install --with-deps chromium firefox webkit
      # A virtual display for the Electron example (harmless for the browser suites).
      - run: xvfb-run -a pnpm e2e
        env:
          # Shared 2-core CI runners are several times slower and noisier than a dev machine, so CI
          # only guards against order-of-magnitude regressions; the local budgets (1000 ms ready,
          # 16 ms keystroke, 3000 ms style analysis) stay strict.
          PL_PERF_READY_MS: '4000'
          PL_PERF_KEY_MS: '50'
          PL_PERF_STYLE_MS: '15000'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: examples/*/test-results

  node20:
    # The packages support Node ≥ 20 on servers (export, import, sync/server); check the oldest one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter node-export start
