name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project site lives under /<repository>/ on GitHub Pages.
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter docs-site exec playwright install --with-deps chromium
      - run: pnpm --filter docs-site e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && vars.DEPLOY_DOCS == 'true'
        with:
          path: site/.vitepress/dist

  # Publishes the site once the owner has enabled GitHub Pages (source: GitHub Actions) and set the
  # repository variable DEPLOY_DOCS=true; see docs/maintainers/github-and-npm.md.
  deploy:
    needs: build
    if: github.event_name == 'push' && vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
